{% extends "base.html" %}
{% block content %}
<h2>Checkout</h2>
<form id="checkoutForm" class="row g-3">
  <div class="col-md-4">
    <label class="form-label">Event Type</label>
    <select id="eventType" class="form-select" required>
      <option>Wedding</option>
      <option>Party</option>
      <option>Corporate</option>
    </select>
  </div>
  <div class="col-md-4">
    <label class="form-label">Guests</label>
    <input id="guests" type="number" min="1" class="form-control" required>
  </div>
  <div class="col-md-4">
    <label class="form-label">Date & Time</label>
    <input id="eventDate" type="datetime-local" class="form-control" required>
  </div>
  <div class="col-12"><button class="btn btn-primary" type="submit">Place Order</button></div>
</form>
<div id="checkoutMessage" class="mt-3"></div>
{% endblock %}
