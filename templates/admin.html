{% extends "base.html" %}
{% block content %}
<h2>Admin Dashboard</h2>
<div class="row g-3 mb-4">
  <div class="col-md-4"><div class="card card-body"><h6>Total Orders</h6><div id="totalOrders">0</div></div></div>
  <div class="col-md-4"><div class="card card-body"><h6>Revenue</h6><div id="totalRevenue">$0</div></div></div>
  <div class="col-md-4"><div class="card card-body"><h6>Customers</h6><div id="totalCustomers">0</div></div></div>
</div>

<div class="card p-3 mb-3">
  <h5>Add Menu Item</h5>
  <form id="menuForm" class="row g-2">
    <div class="col-md-3"><input id="mName" class="form-control" placeholder="Name" required></div>
    <div class="col-md-2"><input id="mCategory" class="form-control" placeholder="Category" required></div>
    <div class="col-md-2"><input id="mPrice" type="number" step="0.01" min="0" class="form-control" placeholder="Price" required></div>
    <div class="col-md-3"><input id="mDescription" class="form-control" placeholder="Description"></div>
    <div class="col-md-2"><button class="btn btn-primary w-100" type="submit">Add</button></div>
  </form>
</div>

<h5>Orders</h5>
<div id="adminOrders"></div>
{% endblock %}
