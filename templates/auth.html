{% extends "base.html" %}
{% block content %}
<div class="row g-4">
  <div class="col-md-6">
    <h3>Login</h3>
    <form id="loginForm" class="vstack gap-2">
      <input id="loginIdentifier" class="form-control" placeholder="Email or Username" required>
      <input id="loginPassword" type="password" class="form-control" placeholder="Password" required>
      <button class="btn btn-primary" type="submit">Login</button>
    </form>
  </div>
  <div class="col-md-6">
    <h3>Register</h3>
    <form id="registerForm" class="vstack gap-2">
      <input id="regName" class="form-control" placeholder="Name" required>
      <input id="regEmail" type="email" class="form-control" placeholder="Email" required>
      <input id="regPassword" type="password" class="form-control" placeholder="Password" required>
      <button class="btn btn-success" type="submit">Register</button>
    </form>
  </div>
</div>
<div id="authMessage" class="mt-3"></div>
{% endblock %}
